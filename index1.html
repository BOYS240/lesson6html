<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Forms </title>
</head>
<body>

    <fieldset>

        <legend>Personal Details </legend>
    <form>
<label>Enter Your Name </label>
<input type="text"> <br><br>
<label>Enter Your Email </label>
<input type="email"> <br><br>
<label>Enter Your Password </label>
<input type="password"> <br><br>
<label> Enter Your Phone Number </label>
<input type="number"> <br><br>
<label>Enter Your Gender </label> <br> <br>
<input type="radio" name="gender" value="female">Female <br><br>
<input type="radio" name="gender" value="male">Male <br><br>
<label>Enter Your Birthday</label>
<input type="date"> <br><br>
<label>Enter Your Age </label>  
<input type="range" min="1" max="100"> <br><br>

<label>Enter Your Country </label>

<select name="Country" id="Country"> <br> <br>
<option value="China">China</option>
<option value="India">India</option>
<option value="United States">United States</option>

</select> <br><br>

<label>Enter Your Favorite Food  </label> <br> <br>

<input type="checkbox" >Pizza <br><br>
<input type="checkbox" >Burger <br><br>


<input type="submit" value="Submit">
</form>

</fieldset>
</body>
</html>
